<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="refresh" content="0; url=./console/index.html">
<title>ES Console</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: #0d0e12; color: #a2a8b3;
    font: 13px/1.6 "Inter", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .ring {
    width: 26px; height: 26px; border-radius: 50%;
    border: 2px solid #26282f; border-top-color: #6366f1;
    animation: rot .7s linear infinite; margin-bottom: 14px;
  }
  @keyframes rot { to { transform: rotate(360deg); } }
  a { color: #818cf8; text-decoration: none; }
</style>
</head>
<body>
  <div class="ring"></div>
  <div>正在进入新版 ES Console…</div>
  <div style="margin-top:6px;font-size:12px;color:#6b7280">若未自动跳转，<a href="./console/index.html">点击这里</a></div>
  <script>location.replace('./console/index.html' + location.search + location.hash);</script>
</body>
</html>
