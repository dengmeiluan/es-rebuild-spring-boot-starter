        <rect x="300" y="2" width="110" height="6" rx="3" fill="#12302d"/>
        <rect x="300" y="2" width="64" height="6" rx="3" fill="url(#score)"/>
        <text x="438" y="10" text-anchor="end" font-family="JetBrains Mono, Consolas, monospace" font-size="8.5" fill="#5eead4">2.97</text>
      </g>
    </g>
