    <text x="126" y="7" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="9.5" letter-spacing="1.5" fill="#3f5b55">·</text>
    <text x="142" y="7" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="9.5" letter-spacing="1.5" fill="#b7d7d1">LUCENE</text>
    <text x="210" y="7" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="9.5" letter-spacing="1.5" fill="#3f5b55">·</text>
