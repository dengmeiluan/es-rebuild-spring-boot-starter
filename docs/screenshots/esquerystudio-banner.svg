<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="ESQueryStudio — the Elasticsearch query workbench for Spring Boot">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081011"/>
      <stop offset="0.55" stop-color="#0b1516"/>
      <stop offset="1" stop-color="#071a19"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.18" r="0.66">
      <stop offset="0" stop-color="#14b8a6" stop-opacity="0.24"/>
      <stop offset="0.55" stop-color="#14b8a6" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#14b8a6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#172324"/>
      <stop offset="1" stop-color="#0d1718"/>
    </linearGradient>
    <linearGradient id="score" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#5eead4" stop-opacity="0.35"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#c8f0eb" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="360" fill="url(#bg)"/>
  <rect width="1280" height="360" fill="url(#grid)"/>
  <rect width="1280" height="360" fill="url(#glow)"/>

