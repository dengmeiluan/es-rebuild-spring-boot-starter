      <text x="56" y="112" fill="#6f8b83">2</text><text x="70" y="112" fill="#c8f0eb">"query"</text><text x="118" y="112" fill="#7fd8cc">: {</text>
      <text x="56" y="128" fill="#6f8b83">3</text><text x="86" y="128" fill="#c8f0eb">"bool"</text><text x="124" y="128" fill="#7fd8cc">: {</text>
      <text x="56" y="144" fill="#6f8b83">4</text><text x="102" y="144" fill="#c8f0eb">"must"</text><text x="140" y="144" fill="#7fd8cc">: [</text>
      <text x="56" y="160" fill="#6f8b83">5</text><text x="118" y="160" fill="#5eead4">{ "match"</text><text x="176" y="160" fill="#7fd8cc">: {</text>
      <text x="56" y="176" fill="#6f8b83">6</text><text x="146" y="176" fill="#5eead4">"title"</text><text x="182" y="176" fill="#7fd8cc">: "研报" } }</text>
      <text x="56" y="192" fill="#6f8b83">7</text><text x="118" y="192" fill="#5eead4">{ "term"</text><text x="168" y="192" fill="#7fd8cc">: {</text>
