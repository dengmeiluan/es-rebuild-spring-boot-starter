    <text x="302" y="7" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="9.5" letter-spacing="1.5" fill="#3f5b55">·</text>
    <text x="318" y="7" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="9.5" letter-spacing="1.5" fill="#b7d7d1">PIT PAGINATION</text>
    <text x="432" y="7" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="9.5" letter-spacing="1.5" fill="#3f5b55">·</text>
    <text x="448" y="7" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="9.5" letter-spacing="1.5" fill="#b7d7d1">SYNTAX BRIDGE</text>
    <text x="1120" y="7" text-anchor="end" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="9.5" letter-spacing="1.2" fill="#3f5b55">ESQUERYSTUDIO 1.0</text>
