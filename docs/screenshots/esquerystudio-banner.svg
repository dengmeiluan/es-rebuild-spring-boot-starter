      <text x="69" y="121" text-anchor="middle" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="7.5" fill="#8fe9dd">ACTIVE</text>
    </g>
    <g transform="translate(18 206)">
      <text x="0" y="10" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="8" letter-spacing="1.2" fill="#6f8b83">TOP HITS</text>
      <g transform="translate(60 0)">
        <text x="0" y="10" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="8.5" fill="#b7d7d1">2026 Q3 半导体行业深度研报</text>
        <rect x="300" y="2" width="110" height="6" rx="3" fill="#12302d"/>
        <rect x="300" y="2" width="92" height="6" rx="3" fill="url(#score)"/>
        <text x="438" y="10" text-anchor="end" font-family="JetBrains Mono, Consolas, monospace" font-size="8.5" fill="#5eead4">3.42</text>
      </g>
      <g transform="translate(60 22)">
        <text x="0" y="10" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="8.5" fill="#8fb3ad">新能源车产业链专题：固态电池拐点</text>
        <rect x="300" y="2" width="110" height="6" rx="3" fill="#12302d"/>
