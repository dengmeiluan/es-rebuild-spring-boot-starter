    <text x="0" y="76" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="64" font-weight="750" letter-spacing="-2.2" fill="#f0fffc">ESQueryStudio</text>
    <text x="2" y="108" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="13.5" font-weight="600" letter-spacing="3.2" fill="#7fd8cc">THE ELASTICSEARCH QUERY WORKBENCH</text>
    <text x="2" y="132" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="13" letter-spacing="0.5" fill="#8fb3ad">for Spring Boot teams that live in their search.</text>

    <g transform="translate(2 166)" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="10" letter-spacing="1.5">
      <rect x="0" y="0" width="116" height="26" rx="13" fill="#2dd4bf" fill-opacity="0.09" stroke="#2dd4bf" stroke-opacity="0.30"/>
      <text x="58" y="17" text-anchor="middle" fill="#8fe9dd">6 QUERY MODES</text>
      <rect x="126" y="0" width="128" height="26" rx="13" fill="#2dd4bf" fill-opacity="0.09" stroke="#2dd4bf" stroke-opacity="0.30"/>
      <text x="190" y="17" text-anchor="middle" fill="#8fe9dd">MAPPING-AWARE</text>
      <rect x="264" y="0" width="108" height="26" rx="13" fill="#2dd4bf" fill-opacity="0.09" stroke="#2dd4bf" stroke-opacity="0.30"/>
      <text x="318" y="17" text-anchor="middle" fill="#8fe9dd">EMBEDDABLE</text>
    </g>
  </g>

  <g transform="translate(732 42)">
    <rect x="0" y="0" width="490" height="292" rx="16" fill="url(#panel)" stroke="#c8f0eb" stroke-opacity="0.14"/>
