name: Bug 反馈
description: 某个功能不符合预期时请用这个模板
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: 感谢反馈！请先搜索现有 issue 避免重复；涉及安全问题请勿在此公开，走 [SECURITY.md](../blob/main/SECURITY.md) 的私密通道。
  - type: dropdown
    id: mode
    attributes:
      label: 运行模式
      options:
        - client（业务应用侧）
        - console（宿主运维控制台）
        - 从源码构建 / 开发
    validations:
      required: true
  - type: textarea
    id: versions
    attributes:
      label: 版本信息
      placeholder: |
        - es-rebuild-spring-boot-starter 版本（如 1.0.2）
        - Spring Boot 版本
        - Elasticsearch 服务端与客户端版本
        - JDK 版本
      validations:
        required: true
  - type: textarea
    id: what-happened
    attributes:
      label: 发生了什么？
      placeholder: 描述期望行为与实际行为，附相关日志（[EsStackContract] / [MappingReconcile] / rebuild 前缀）。不要贴凭据。
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 复现步骤
      placeholder: |
        1. 配置 …
        2. 启动 …
        3. 触发 …
    validations:
      required: true
