name: 功能建议
description: 提出新想法或改进建议
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题？
      placeholder: 描述你遇到的场景与痛点，而不是直接给方案
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      placeholder: 如果你有思路，简述即可；没有也没关系
  - type: dropdown
    id: mode
    attributes:
      label: 你的运行模式
      options:
        - client（业务应用侧）
        - console（宿主运维控制台）
        - 从源码构建 / 开发
  - type: checkboxes
    id: ack
    attributes:
      label: 确认
      options:
        - label: 我已搜索现有 issue，确认没有重复
          required: true
