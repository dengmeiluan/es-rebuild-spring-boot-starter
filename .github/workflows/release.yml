name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Validate tag against project versions
        run: |
          VERSION=$(python3 - <<'PY'
          import re
          pom = open("pom.xml", encoding="utf-8").read()
          start = pom.index("<artifactId>esquerystudio</artifactId>")
          print(re.search(r"<version>([^<]+)</version>", pom[start:]).group(1))
          PY
          )
          python3 - "$VERSION" <<'PY'
          import json, re, sys
          version = sys.argv[1]
          for path in ("ui/package.json",):
              declared = json.load(open(path, encoding="utf-8"))["version"]
              if declared != version:
                  raise SystemExit(f"{path}: {declared} != {version}")
          citation = open("CITATION.cff", encoding="utf-8").read()
          declared = re.search(r"^version:\s*(\S+)\s*$", citation, re.MULTILINE).group(1)
          if declared != version:
              raise SystemExit(f"CITATION.cff: {declared} != {version}")
          print(f"version {version}")
          PY
          if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match project version v$VERSION" >&2
            exit 1
          fi

      - name: Build UI
        working-directory: ui
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Verify Chrome extension
        run: node scripts/verify-extension.mjs

      - name: Build Maven release artifacts and SBOM
        run: mvn -B -P release -DskipTests -Dconsole.build.skip=true verify

      - name: Collect release assets
        run: |
          VERSION=$(python3 - <<'PY'
          import re
          pom = open("pom.xml", encoding="utf-8").read()
          start = pom.index("<artifactId>esquerystudio</artifactId>")
          print(re.search(r"<version>([^<]+)</version>", pom[start:]).group(1))
          PY
          )
          mkdir -p dist
          cp "apps/server/target/esquerystudio-server-${VERSION}.jar" dist/
          cp "platform/target/esquerystudio-platform-${VERSION}.jar" dist/
          cp "modules/console/target/esquerystudio-console-${VERSION}.jar" dist/
          for f in platform/target/esquerystudio-platform-${VERSION}-sources.jar \
                   platform/target/esquerystudio-platform-${VERSION}-javadoc.jar \
                   modules/console/target/esquerystudio-console-${VERSION}-sources.jar \
                   modules/console/target/esquerystudio-console-${VERSION}-javadoc.jar; do
            if [ -f "$f" ]; then cp "$f" dist/; fi
          done
          cp target/esquerystudio-sbom.json dist/
          (cd extensions/chrome && zip -qr "../../dist/esquerystudio-chrome-${VERSION}.zip" .)

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/*"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # GitHub API 偶发 502：重试创建；若已建但资产未传完则补传（幂等收口）
          for attempt in 1 2 3; do
            if gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --title "ESQueryStudio ${{ github.ref_name }}"; then
              exit 0
            fi
            if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
              echo "Release exists after a transient failure; ensuring assets are present."
              gh release upload "$GITHUB_REF_NAME" dist/* --clobber
              exit 0
            fi
            echo "Release publish attempt $attempt failed; retrying in 15s..." >&2
            sleep 15
          done
          echo "Release publish failed after 3 attempts." >&2
          exit 1

      - name: Upload release artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-dist
          path: dist
          retention-days: 7
