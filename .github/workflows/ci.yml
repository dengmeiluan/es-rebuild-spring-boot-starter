name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: console/package-lock.json
      # 前端产物 git-ignored。npm ci 优先（严格锁安装）；锁文件在 Windows 上生成、
      # 跨平台偶发可选依赖覆盖缺口，失败时回落 npm install 活解析自愈并把诊断写进
      # step summary（本步红则后两步被跳过，定位一目了然）
      - name: Install console deps
        working-directory: console
        run: |
          if ! npm ci; then
            echo "### npm ci failed — falling back to npm install (self-heal)" >> "$GITHUB_STEP_SUMMARY"
            npm install --no-audit --no-fund --loglevel=error || exit 1
          fi
      - name: Build console
        working-directory: console
        run: npm run build
      - name: Backend tests (default path, npm inside maven on POSIX)
        run: mvn -B clean test
      # 双部署形态回归：standalone（可执行应用 jar）依赖本地仓里的 starter，
      # install 后构建并跑其契约+启动冒烟测试（空环境起完整上下文）
      - name: Standalone build & smoke tests
        run: |
          mvn -B install -DskipTests
          cd standalone && mvn -B test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console
    # 控制台日期/时间显示按东八区产品语义断言（若干守卫用例对固定 epoch 断言本地时刻），
    # runner 默认 UTC 会让 epoch 落日漂移——显式钉定时区，与主要用户环境一致
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: console/package-lock.json
      - run: |
          if ! npm ci; then
            echo "### npm ci failed — falling back to npm install (self-heal)" >> "$GITHUB_STEP_SUMMARY"
            npm install --no-audit --no-fund --loglevel=error || exit 1
          fi
      # 产物体积守卫（bundleBudget436）扫描 vite 产物目录——测试前必须先 build
      - name: Build console
        run: npm run build
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: |
          set -o pipefail
          npx vitest run --reporter=json --outputFile=/tmp/vitest.json > /tmp/vitest.log 2>&1 || true
          node -e "
            const r=require('/tmp/vitest.json');
            const bad=[];
            for(const f of r.testResults||[]) for(const t of f.assertionResults||[])
              if(t.status==='failed') bad.push((f.name||'').split('/src/')[1]+' :: '+t.fullName+' :: '+String(t.failureMessages&&t.failureMessages[0]||'').split('\n').slice(0,4).join(' | '));
            for(const b of bad.slice(0,50)) console.log('::error::'+b.slice(0,400));
            if(bad.length) process.exit(1);"
