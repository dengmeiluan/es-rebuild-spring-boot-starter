name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: console/package-lock.json
      # 前端产物 git-ignored。npm ci 优先（严格锁安装）；锁文件在 Windows 上生成、
      # 跨平台偶发可选依赖覆盖缺口，失败时回落 npm install 活解析自愈并把诊断写进
      # step summary（本步红则后两步被跳过，定位一目了然）
      - name: Install console deps
        working-directory: console
        run: |
          if ! npm ci; then
            echo "### npm ci failed — falling back to npm install (self-heal)" >> "$GITHUB_STEP_SUMMARY"
            npm install --no-audit --no-fund --loglevel=error || exit 1
          fi
      - name: Build console
        working-directory: console
        run: npm run build
      - name: Backend tests (default path, npm inside maven on POSIX)
        run: mvn -B clean test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: console/package-lock.json
      - run: |
          if ! npm ci; then
            echo "### npm ci failed — falling back to npm install (self-heal)" >> "$GITHUB_STEP_SUMMARY"
            npm install --no-audit --no-fund --loglevel=error || exit 1
          fi
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
